<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch — Aster Agentic Allocation Simulation</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-head" data-chrome="head"></header>

<main>
  <div class="wrap">

    <div id="fac" class="fac-bar hide">
      <span class="lab">Facilitator</span>
      <label class="small">Phase
        <select id="fac-phase" style="width:auto;display:inline-block;margin-left:6px"></select>
      </label>
      <span class="lab">Readiness</span>
      <input type="range" id="fac-readiness" min="0" max="100" step="5" value="0">
      <span class="mono" id="fac-readiness-v">0%</span>
    </div>

    <section>
      <h1>Your agent is negotiating</h1>
      <p class="lede">Watch the terminal. You cannot intervene — everything you wanted to say is already in
        the brief you handed in.</p>
    </section>

    <section>
      <div class="eyebrow">Round protocol</div>
      <div class="phases" id="phases"></div>
    </section>

    <section>
      <div class="eyebrow">What to look for</div>
      <div class="grid grid-2" id="prompts"></div>
    </section>

    <section>
      <div class="readiness">
        <div class="lab">ENTERPRISE READINESS</div>
        <div class="track"><div class="fill" id="rd-fill"></div></div>
        <div class="state" id="rd-state">FORMING</div>
        <div class="pct" id="rd-pct">0%</div>
      </div>
    </section>

    <section>
      <div class="eyebrow">Who is speaking</div>
      <div class="legend" id="legend"></div>
    </section>

  </div>
</main>

<footer class="site-foot" data-chrome="foot"></footer>

<script src="data/scenario.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var A = window.Aster, S = A.S, el = A.el;

  function stateFor(pct) {
    for (var i = 0; i < S.readiness_states.length; i++) {
      if (pct <= S.readiness_states[i].max) return S.readiness_states[i].label;
    }
    return S.readiness_states[S.readiness_states.length - 1].label;
  }

  function colorFor(pct) {
    if (pct <= 25) return "var(--text-3)";
    if (pct <= 55) return "var(--warn)";
    if (pct <= 80) return "var(--alarm)";
    return "var(--ok)";
  }

  function setReadiness(pct) {
    pct = Math.max(0, Math.min(100, pct));
    var c = colorFor(pct);
    A.qs("#rd-fill").style.width = pct + "%";
    A.qs("#rd-fill").style.background = c;
    A.qs("#rd-state").textContent = stateFor(pct);
    A.qs("#rd-state").style.color = c;
    A.qs("#rd-pct").textContent = pct + "%";
  }

  function setPhase(n) {
    A.qsa(".phase").forEach(function (p) {
      p.setAttribute("data-on", Number(p.getAttribute("data-n")) === n ? "1" : "0");
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var ph = A.qs("#phases");
    S.protocol.forEach(function (p) {
      ph.appendChild(el("div", { class: "phase", "data-n": String(p.n), "data-on": "0" }, [
        el("div", { class: "pn", text: String(p.n) }),
        el("div", null, [
          el("div", { class: "pt", text: p.name }),
          el("div", { class: "tp", text: p.topology }),
          el("div", { class: "pw", text: p.what })
        ])
      ]));
    });

    var pr = A.qs("#prompts");
    S.watch_prompts.forEach(function (q) {
      pr.appendChild(el("div", { class: "card" }, [el("p", { class: "mb0", style: "font-size:17px", text: q })]));
    });

    var lg = A.qs("#legend");
    S.groups.forEach(function (g) {
      var it = el("div", { class: "legend-item" }, [
        el("div", { class: "legend-dot" }),
        el("div", null, [el("div", { class: "cd", text: g.agent }), el("div", { class: "nm", text: g.name })])
      ]);
      A.applyAccent(it, g.accent);
      lg.appendChild(it);
    });
    var atlas = el("div", { class: "legend-item a-slate" }, [
      el("div", { class: "legend-dot" }),
      el("div", null, [
        el("div", { class: "cd", text: S.orchestrator.agent }),
        el("div", { class: "nm", text: S.orchestrator.unit })
      ])
    ]);
    lg.appendChild(atlas);

    var phase = parseInt(A.param("phase") || "0", 10);
    if (phase >= 1 && phase <= S.protocol.length) setPhase(phase);

    var readiness = parseInt(A.param("readiness") || "0", 10);
    setReadiness(isNaN(readiness) ? 0 : readiness);

    if (A.isFacilitator()) {
      var bar = A.qs("#fac");
      bar.classList.remove("hide");
      var sel = A.qs("#fac-phase");
      sel.appendChild(el("option", { value: "0", text: "— none —" }));
      S.protocol.forEach(function (p) {
        var o = el("option", { value: String(p.n), text: p.n + " · " + p.name });
        if (p.n === phase) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { setPhase(parseInt(sel.value, 10)); });

      var rng = A.qs("#fac-readiness");
      rng.value = String(readiness || 0);
      A.qs("#fac-readiness-v").textContent = (readiness || 0) + "%";
      rng.addEventListener("input", function () {
        setReadiness(parseInt(rng.value, 10));
        A.qs("#fac-readiness-v").textContent = rng.value + "%";
      });
    }
  });
})();
</script>
</body>
</html>
