<!doctype html>
<html lang="en" class="fit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — The Coordination Problem</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing">

  <nav id="nav"></nav>

  <header class="landing__head">
    <h1 class="landing__title" id="title"></h1>
    <p class="landing__subtitle" id="subtitle"></p>
  </header>

  <p class="landing__disclaimer" id="disclaimer"></p>

  <section class="landing__body" id="body"></section>

  <section class="figures" id="figures"></section>

  <section class="cards" id="cards"></section>

  <section class="doer">
    <p class="doer__line" id="do-line"></p>
    <a class="link-quiet" id="do-link" href="instructions.html"></a>
  </section>

  <footer class="landing__foot">
    <a class="btn btn--primary" id="begin" href="instructions.html"></a>
    <a class="link-quiet" id="secondary" href="debrief.html"></a>
    <a class="link-quiet" id="guide" href="facilitate.html"></a>
  </footer>

  <script src="data/model.js"></script>
  <script src="data/script.js"></script>
  <script src="assets/nav.js"></script>
  <script>
  (function () {
    "use strict";
    var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
    var L = S.landing;
    var el = function (id) { return document.getElementById(id); };

    document.title = A.meta.org + " — " + L.title;
    el("title").textContent = L.title;
    el("subtitle").textContent = L.subtitle;
    el("disclaimer").textContent = A.meta.disclaimer +
      " " + A.meta.unit + ", " + A.meta.setting + ".";

    L.paragraphs.forEach(function (text) {
      var p = document.createElement("p");
      p.textContent = FMT.fill(text);
      el("body").appendChild(p);
    });

    // Every figure on this page is read out of the model, never typed here.
    var values = [
      FMT.moneyInt(A.ambition),
      FMT.moneyInt(A.infrastructure_required),
      FMT.moneyInt(FMT.sum("capital_need")),
      FMT.moneyInt(FMT.sum("cross_value"))
    ];
    L.figures.forEach(function (f, i) {
      var d = document.createElement("div");
      d.className = "figures__cell";
      d.innerHTML = '<div class="figures__value tabular"></div>' +
                    '<div class="figures__label"></div>' +
                    '<div class="figures__note"></div>';
      d.querySelector(".figures__value").textContent = values[i];
      d.querySelector(".figures__label").textContent = f.label;
      d.querySelector(".figures__note").textContent = f.note;
      el("figures").appendChild(d);
    });

    A.groups.forEach(function (g) {
      // Each card is the way into that division's own page.
      var c = document.createElement("a");
      c.className = "card card--link accent-" + g.accent;
      c.href = g.id + ".html";
      c.innerHTML =
        '<div class="card__name"><span class="dot"></span></div>' +
        '<div class="card__lead"></div>' +
        '<div class="card__pool tabular"><span></span></div>' +
        '<div class="card__descriptor"></div>';
      c.querySelector(".card__name").appendChild(document.createTextNode(g.short));
      c.querySelector(".card__lead").textContent = g.lead;
      c.querySelector(".card__pool").insertBefore(
        document.createTextNode(FMT.moneyInt(g.local_pool)),
        c.querySelector(".card__pool span"));
      c.querySelector(".card__pool span").textContent = S.landing.pool_label;
      c.querySelector(".card__descriptor").textContent =
        FMT.fillFor(S.groups[g.id].descriptor, g);
      var cta = document.createElement("span");
      cta.className = "card__cta";
      cta.textContent = S.divisions.cta;
      c.appendChild(cta);
      el("cards").appendChild(c);
    });

    el("do-line").textContent = FMT.fill(L.do_line);
    el("do-link").textContent = L.do_link;

    el("begin").textContent = L.begin;
    el("secondary").textContent = L.secondary;
    el("guide").textContent = S.nav.guide;
    el("guide").title = S.nav.guide_note;
  })();
  </script>
</body>
</html>
