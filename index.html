<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — The Coordination Problem</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="doc-body">
<div class="doc">

  <nav id="nav"></nav>

  <header class="doc__head">
    <h1 id="title"></h1>
    <p class="standfirst" id="subtitle"></p>
  </header>

  <!-- The situation, one labelled section per block, read top to bottom. -->
  <div id="story"></div>

  <section>
    <h2 id="do-heading"></h2>
    <div class="prose" id="do-line"></div>
  </section>

  <section id="divisions">
    <h2 id="cards-heading"></h2>
    <p class="caption" id="cards-caption"></p>
    <div class="cards" id="cards"></div>
  </section>

  <footer class="doc__foot">
    <a class="btn btn--primary" id="begin" href="instructions.html"></a>
    <a class="link-quiet" id="do-link" href="instructions.html"></a>
    <a class="link-quiet" id="guide" href="facilitate.html"></a>
  </footer>

  <p class="disclaimer" id="disclaimer"></p>

</div>

<script src="data/model.js"></script>
<script src="data/script.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
  var L = S.landing;
  var el = function (id) { return document.getElementById(id); };

  document.title = A.meta.org + " — " + L.title;
  el("title").textContent = L.title;
  el("subtitle").textContent = L.subtitle;
  el("disclaimer").textContent = A.meta.disclaimer +
    " " + A.meta.unit + ", " + A.meta.setting + ".";

  /* The situation — each block is a heading and a paragraph, so the page says
     what you are reading before you read it, and the order is top to bottom. */
  L.story.forEach(function (item) {
    var s = document.createElement("section");
    var h = document.createElement("h2");
    h.textContent = item.label;
    var wrap = document.createElement("div");
    wrap.className = "prose";
    var p = document.createElement("p");
    p.textContent = FMT.fill(item.body);
    wrap.appendChild(p);
    s.appendChild(h);
    s.appendChild(wrap);
    el("story").appendChild(s);
  });

  el("cards-heading").textContent = L.cards_heading;
  el("cards-caption").textContent = FMT.fill(L.cards_caption);

  A.groups.forEach(function (g) {
    // Each card opens that division's brief in its own tab, so a group can keep all
    // three briefs open beside this page while it works.
    var c = document.createElement("a");
    c.className = "card card--link accent-" + g.accent;
    c.href = g.id + ".html";
    c.target = "_blank";
    c.rel = "noopener";
    c.innerHTML =
      '<div class="card__name"><span class="dot"></span></div>' +
      '<div class="card__lead"></div>' +
      '<div class="card__descriptor"></div>';
    c.querySelector(".card__name").appendChild(document.createTextNode(g.short));
    c.querySelector(".card__lead").textContent = g.lead;
    c.querySelector(".card__descriptor").textContent =
      FMT.fill(S.groups[g.id].descriptor);
    var cta = document.createElement("span");
    cta.className = "card__cta btn btn--card";
    cta.textContent = S.divisions.cta;
    c.appendChild(cta);
    el("cards").appendChild(c);
  });

  el("do-heading").textContent = L.do_heading;
  L.do_line.forEach(function (text) {
    var p = document.createElement("p");
    p.textContent = FMT.fill(text);
    el("do-line").appendChild(p);
  });
  el("do-link").textContent = L.do_link;

  el("begin").textContent = L.begin;
  el("guide").textContent = S.nav.guide;
  el("guide").title = S.nav.guide_note;
})();
</script>
</body>
</html>
