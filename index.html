<!doctype html>
<html lang="en" class="fit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — The Coordination Problem</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing">

  <nav id="nav"></nav>

  <header class="landing__head">
    <h1 class="landing__title" id="title"></h1>
    <p class="landing__subtitle" id="subtitle"></p>
  </header>

  <section class="story" id="story"></section>

  <section class="landing__divisions">
    <p class="eyebrow" id="cards-label"></p>
    <div class="cards" id="cards"></div>
  </section>

  <section class="doer">
    <p class="doer__line" id="do-line"></p>
    <a class="link-quiet" id="do-link" href="instructions.html"></a>
  </section>

  <footer class="landing__foot">
    <div class="landing__actions">
      <a class="btn btn--primary" id="begin" href="instructions.html"></a>
      <a class="link-quiet" id="guide" href="facilitate.html"></a>
    </div>
    <p class="landing__disclaimer" id="disclaimer"></p>
  </footer>

  <script src="data/model.js"></script>
  <script src="data/script.js"></script>
  <script src="assets/nav.js"></script>
  <script>
  (function () {
    "use strict";
    var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
    var L = S.landing;
    var el = function (id) { return document.getElementById(id); };

    document.title = A.meta.org + " — " + L.title;
    el("title").textContent = L.title;
    el("subtitle").textContent = L.subtitle;
    el("disclaimer").textContent = A.meta.disclaimer +
      " " + A.meta.unit + ", " + A.meta.setting + ".";

    // The first block is the lead — set larger, so the eye has one place to start.
    L.story.forEach(function (item, i) {
      var d = document.createElement("div");
      d.className = "story__item" + (i === 0 ? " story__item--lead" : "");
      var label = document.createElement("p");
      label.className = "eyebrow";
      label.textContent = item.label;
      var p = document.createElement("p");
      p.textContent = FMT.fill(item.body);
      d.appendChild(label);
      d.appendChild(p);
      el("story").appendChild(d);
    });

    el("cards-label").textContent = L.cards_label;

    A.groups.forEach(function (g) {
      // Each card is the way into that division's own page.
      var c = document.createElement("a");
      c.className = "card card--link accent-" + g.accent;
      c.href = g.id + ".html";
      c.innerHTML =
        '<div class="card__name"><span class="dot"></span></div>' +
        '<div class="card__lead"></div>' +
        '<div class="card__descriptor"></div>';
      c.querySelector(".card__name").appendChild(document.createTextNode(g.short));
      c.querySelector(".card__lead").textContent = g.lead;
      c.querySelector(".card__descriptor").textContent =
        FMT.fill(S.groups[g.id].descriptor);
      var cta = document.createElement("span");
      cta.className = "card__cta";
      cta.textContent = S.divisions.cta;
      c.appendChild(cta);
      el("cards").appendChild(c);
    });

    el("do-line").textContent = FMT.fill(L.do_line);
    el("do-link").textContent = L.do_link;

    el("begin").textContent = L.begin;
    el("guide").textContent = S.nav.guide;
    el("guide").title = S.nav.guide_note;
  })();
  </script>
</body>
</html>
