<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — Debrief</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="debrief">

  <nav id="nav"></nav>

  <header>
    <h1 id="title"></h1>
    <p class="caption" id="disclaimer"></p>
  </header>

  <section>
    <h2 id="c-heading"></h2>
    <p class="caption" id="c-caption"></p>
    <table class="grid" id="c-table"></table>
  </section>

  <section>
    <h2 id="i-heading"></h2>
    <p class="caption" id="i-caption"></p>
    <table class="grid" id="i-table"></table>
  </section>

  <section>
    <h2 id="m-heading"></h2>
    <p class="caption" id="m-caption"></p>
    <table class="grid" id="m-table"></table>
  </section>

  <section>
    <h2 id="d-heading"></h2>
    <table class="grid" id="d-table"></table>
  </section>

  <section>
    <h2 id="o-heading"></h2>
    <p class="caption" id="o-caption"></p>
    <table class="grid" id="o-table"></table>
    <h3 id="pilot-heading"></h3>
    <p class="prose callout" id="pilot-body"></p>
  </section>

  <section>
    <h2 id="a-heading"></h2>
    <p class="caption" id="a-caption"></p>
    <table class="grid" id="a-table"></table>
    <p class="prose callout" id="a-close"></p>
  </section>

  <section>
    <h2 id="q-heading"></h2>
    <ol class="questions" id="q-list"></ol>
  </section>

  <section class="closing">
    <h2 id="z-heading"></h2>
    <p id="z-body"></p>
  </section>

  <footer class="debrief__foot">
    <a class="btn" href="sim.html" id="back"></a>
    <a class="link-quiet" href="index.html" id="home"></a>
    <a class="link-quiet" href="facilitate.html" id="guide"></a>
  </footer>

</div>

<script src="data/model.js"></script>
<script src="data/script.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
  var D = S.debrief;
  var money = FMT.money, moneyInt = FMT.moneyInt;
  var el = function (id) { return document.getElementById(id); };

  function table(node, headers, rows) {
    var thead = "<thead><tr>" + headers.map(function (h) {
      return "<th" + (h.num ? " class='num'" : "") + "></th>";
    }).join("") + "</tr></thead>";
    node.innerHTML = thead + "<tbody></tbody>";
    var ths = node.querySelectorAll("th");
    headers.forEach(function (h, i) { ths[i].textContent = h.label; });
    var tb = node.querySelector("tbody");
    rows.forEach(function (cells) {
      var tr = document.createElement("tr");
      if (cells.cls) tr.className = cells.cls;
      cells.forEach(function (c) {
        var td = document.createElement("td");
        if (c && c.num) td.className = "num";
        if (c && c.cls) td.className = ((td.className ? td.className + " " : "") + c.cls);
        if (c && c.html !== undefined) td.innerHTML = c.html;
        else td.textContent = (c && c.text !== undefined) ? c.text : c;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }

  document.title = A.meta.org + " — " + D.title;
  el("title").textContent = D.title;
  el("disclaimer").textContent = A.meta.disclaimer;

  /* 1. Forces incentivising collaboration */
  el("c-heading").textContent = D.collaborate.heading;
  el("c-caption").textContent = D.collaborate.caption;
  table(el("c-table"),
    [{ label: "Factor" }, { label: "Description" }],
    D.collaborate.rows.map(function (r) {
      return [{ text: r[0], cls: "factor" }, r[1]];
    }));

  /* 2. Forces incentivising individualism */
  el("i-heading").textContent = D.individualism.heading;
  el("i-caption").textContent = D.individualism.caption;
  table(el("i-table"),
    [{ label: "Factor" }, { label: "What it sounds like" }, { label: "What it actually is" }],
    D.individualism.rows.map(function (r) {
      return [{ text: r[0], cls: "factor" }, { text: r[1], cls: "quote" }, r[2]];
    }));

  /* 3. The four moves */
  el("m-heading").textContent = D.moves.heading;
  el("m-caption").textContent = D.moves.caption;
  table(el("m-table"),
    [{ label: "Move" }, { label: "Cost", num: true }, { label: "Answers" }, { label: "What it is" }],
    A.moves.map(function (m) {
      return [
        { text: m.label, cls: "factor" },
        { text: moneyInt(m.cost), num: true },
        m.answers.charAt(0).toUpperCase() + m.answers.slice(1),
        m.blurb
      ];
    }));

  /* 4. The applied diagnosis */
  el("d-heading").textContent = D.diagnosis.heading;
  table(el("d-table"),
    [{ label: "Division" }, { label: "Pull" }, { label: "Block" }, { label: "Move(s)" }],
    A.groups.map(function (g) {
      var d = D.diagnosis.rows[g.id];
      return [
        { text: g.name, cls: "factor" },
        { html: "<b>" + d.pull + "</b> — " + d.pull_note },
        { html: "<b>" + g.block.charAt(0).toUpperCase() + g.block.slice(1) + "</b>" },
        { html: FMT.needs(g.id).map(function (id) { return "<b>" + FMT.move(id).label + "</b>"; }).join(" + ") }
      ];
    }));

  /* 5. Every reachable outcome, with this session's outcome highlighted */
  el("o-heading").textContent = D.outcomes.heading;
  el("o-caption").textContent = D.outcomes.caption;

  var m = /committed=([^&]*)/.exec(window.location.hash || "");
  var currentKey = null;
  if (m) {
    var raw = decodeURIComponent(m[1]);
    currentKey = (raw === "none" || raw === "") ? "" : raw.split(",").sort().join("|");
  }

  var rows = FMT.outcomes().map(function (o) {
    var r = o.result;
    var names = o.members.length
      ? o.members.map(function (id) { return FMT.group(id).short; }).join(" + ")
      : "Nobody";
    var cells = [
      names,
      { text: moneyInt(r.pledged), num: true },
      { text: r.funded ? "Funded" : "Not funded", cls: r.funded ? "mint" : "coral" },
      { text: money(r.enterprise), num: true },
      { text: (r.gap <= 0 ? "Ahead " : "Short ") + money(Math.abs(r.gap)),
        num: true, cls: r.gap <= 0 ? "mint" : "coral" }
    ];
    if (currentKey !== null && o.key === currentKey) cells.cls = "is-current";
    return cells;
  });
  table(el("o-table"),
    [{ label: "Committed" }, { label: "Pledged", num: true }, { label: "Layer" },
     { label: "Enterprise value", num: true }, { label: "Vs ambition", num: true }],
    rows);

  /* 5b. The pilot trap, named under the table that proves it */
  el("pilot-heading").textContent = D.outcomes.pilot_heading;
  el("pilot-body").textContent = FMT.fill(D.outcomes.pilot);

  /* 5c. What makes this an agentic problem rather than a shared-services one */
  el("a-heading").textContent = D.agentic.heading;
  el("a-caption").textContent = FMT.fill(D.agentic.caption);
  el("a-table").innerHTML = "<tbody></tbody>";
  var abody = el("a-table").querySelector("tbody");
  D.agentic.rows.forEach(function (r) {
    var tr = document.createElement("tr");
    var th = document.createElement("td");
    th.className = "factor";
    th.textContent = r[0];
    var td = document.createElement("td");
    td.textContent = FMT.fill(r[1]);
    tr.appendChild(th);
    tr.appendChild(td);
    abody.appendChild(tr);
  });
  el("a-close").textContent = FMT.fill(D.agentic.close);

  /* 6. Discussion */
  el("q-heading").textContent = D.questions.heading;
  D.questions.items.forEach(function (q) {
    var li = document.createElement("li");
    li.textContent = FMT.fill(q);
    el("q-list").appendChild(li);
  });

  /* 7. The block the model leaves out */
  el("z-heading").textContent = D.closing.heading;
  el("z-body").textContent = FMT.fill(D.closing.body);

  el("back").textContent = "Back to the board";
  el("home").textContent = "Start over";
  el("guide").textContent = S.nav.guide;
  el("guide").title = S.nav.guide_note;
})();
</script>
</body>
</html>
