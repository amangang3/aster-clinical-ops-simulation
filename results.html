<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — Aster Agentic Allocation Simulation</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-head" data-chrome="head"></header>

<main>
  <div class="wrap">

    <section id="paste-section">
      <h1>The allocation</h1>
      <p class="lede">Paste the <code>results.json</code> your facilitator's terminal wrote, or load a
        committed run.</p>
      <div class="paste-box">
        <textarea id="paste" placeholder='{ "round": 1, "totals": { ... }, "groups": [ ... ] }'></textarea>
        <div class="btn-row">
          <button class="btn btn-primary a-slate" id="btn-render">Render results</button>
          <button class="btn" id="btn-demo">Load example run</button>
        </div>
      </div>
      <div id="errors" class="hide" style="margin-top:var(--gap)"></div>
    </section>

    <div id="out" class="hide"></div>

  </div>
</main>

<footer class="site-foot" data-chrome="foot"></footer>

<script src="data/scenario.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var A = window.Aster, S = A.S, M = A.M, el = A.el;

  function accentHex(id) {
    var g = A.groupById(id);
    return A.ACCENT_HEX[g ? g.accent : "slate"];
  }
  function accentClass(id) {
    var g = A.groupById(id);
    return { amber: "a-amber", cyan: "a-cyan", violet: "a-violet" }[g ? g.accent : "slate"] || "a-slate";
  }

  function showErrors(list) {
    var box = A.qs("#errors");
    box.innerHTML = "";
    box.className = "";
    box.appendChild(el("div", { class: "error-box" }, [
      el("div", { class: "t", text: "That JSON did not validate" }),
      el("ul", null, list.slice(0, 12).map(function (e) { return el("li", { text: e }); })),
      list.length > 12 ? el("p", { class: "small mb0", text: "…and " + (list.length - 12) + " more." }) : null
    ]));
  }

  /* ---------- sections ---------- */

  function gateBanner(r) {
    var t = r.totals, met = !!t.gate_met;
    var head = met
      ? "ENTERPRISE TARGET MET — $" + A.money0(t.enterprise_value) + "M of $" + A.money0(t.enterprise_target) + "M"
      : "ENTERPRISE COMMITMENT MISSED — $" + A.money0(t.enterprise_value) + "M of $" + A.money0(t.enterprise_target) + "M";
    var sub = met
      ? "The shared platform was funded. The cross-boundary pool opened and every group's agents could work across the boundary."
      : "Shared infrastructure was not funded. Every group's agents stayed inside their own boundary.";
    return el("div", { class: "gate " + (met ? "met" : "missed") }, [
      el("div", { class: "hl", text: head }),
      el("div", { class: "sub", text: sub })
    ]);
  }

  function commitmentGap(r) {
    var t = r.totals;
    var committed = t.target_committed, ambition = t.target_ambition, gap = t.commitment_gap;
    var short = gap > 0;
    var sec = el("section");
    sec.appendChild(el("div", { class: short ? "counterfactual" : "callout ok" }, [
      el("div", { class: "eyebrow", text: "What the groups committed to" }),
      el("p", { class: "big" }, [
        document.createTextNode("The three groups committed to "),
        el("em", { text: "$" + A.money0(committed) + "M" }),
        document.createTextNode(" between them, against a "),
        el("em", { text: "$" + A.money0(ambition) + "M" }),
        document.createTextNode(short ? " enterprise ambition — short by " : " enterprise ambition — over by "),
        el("em", { text: "$" + A.money0(Math.abs(gap)) + "M" }),
        document.createTextNode(" before a single agent was built.")
      ]),
      el("p", { class: "muted small mb0",
        text: short
          ? "Nobody set these numbers for them. Each group chose the target it was willing to carry, because only a P&L owner can commit a number into a plan."
          : "Each group chose the target it was willing to carry. Collectively they went past what was asked of them." })
    ]));
    return sec;
  }

  function leaderboard(r) {
    var met = !!r.totals.gate_met;
    var gs = r.groups.slice().sort(function (a, b) { return b.group_score - a.group_score; });
    if (met && Array.isArray(r.ranking) && r.ranking.length) {
      gs = r.ranking.map(function (id) {
        return r.groups.filter(function (g) { return g.id === id; })[0];
      }).filter(Boolean);
    }
    var sec = el("section");
    sec.appendChild(el("div", { class: "eyebrow", text: "Leaderboard" }));
    if (!met) sec.appendChild(el("div", { class: "board-head", text: "NO WINNER — ENTERPRISE COMMITMENT MISSED" }));
    var board = el("div", { class: "board" + (met ? "" : " greyed") });
    gs.forEach(function (g, i) {
      var row = el("div", { class: "board-row", "data-rank": met ? String(i + 1) : "0" }, [
        el("div", { class: "rk", text: met ? String(i + 1) : "—" }),
        el("div", null, [
          el("div", { class: "nm", text: g.name }),
          el("div", { class: "cd", text: g.agent })
        ]),
        el("div", { class: "sc" }, [
          el("span", { class: "lbl", text: "SCORE" }),
          document.createTextNode((g.group_score >= 0 ? "+" : "") + A.money(g.group_score))
        ])
      ]);
      A.applyAccent(row, (A.groupById(g.id) || {}).accent);
      board.appendChild(row);
    });
    sec.appendChild(board);
    if (!met) sec.appendChild(el("p", { class: "muted small", style: "margin-top:14px",
      text: "Raw scores are shown, but no ranking is awarded. The enterprise target was not reached." }));
    return sec;
  }

  function allocChart(r) {
    var sec = el("section");
    sec.appendChild(el("div", { class: "eyebrow", text: "Allocation" }));
    sec.appendChild(el("h2", { text: "Who got what" }));

    var blocks = [
      { key: "capital", label: "Platform capital", total: r.totals.capital, fmt: function (v) { return "$" + v + "M"; }, burden: false },
      { key: "engineering", label: "Central engineering", total: r.totals.engineering, fmt: function (v) { return v + " eq"; }, burden: false },
      { key: "target", label: "Target each group committed to", total: r.totals.target_committed,
        fmt: function (v) { return "$" + v + "M"; }, burden: true }
    ];

    var wrap = el("div", { class: "alloc" });
    blocks.forEach(function (b) {
      var bar = el("div", { class: "alloc-bar" + (b.burden ? " burden" : "") });
      r.groups.forEach(function (g) {
        var v = g[b.key] || 0;
        var pct = b.total > 0 ? (v / b.total) * 100 : 0;
        var hex = accentHex(g.id);
        var seg = el("div", {
          class: "alloc-seg",
          style: "width:" + pct + "%;background:" + hex + ";--seg-color:" + hex,
          title: g.name + " — " + b.fmt(v)
        }, [document.createTextNode(pct > 11 ? b.fmt(v) : "")]);
        bar.appendChild(seg);
      });
      wrap.appendChild(el("div", { class: "alloc-block" }, [
        el("div", { class: "ttl" }, [
          el("div", { class: "n", text: b.label + (b.burden ? " — burden, not prize" : "") }),
          el("div", { class: "t", text: "total " + b.fmt(b.total) })
        ]),
        bar
      ]));
    });
    sec.appendChild(wrap);

    var leg = el("div", { class: "legend", style: "margin-top:18px" });
    r.groups.forEach(function (g) {
      var it = el("div", { class: "legend-item" }, [
        el("div", { class: "legend-dot" }),
        el("div", null, [el("div", { class: "cd", text: g.agent }), el("div", { class: "nm", text: g.name })])
      ]);
      A.applyAccent(it, (A.groupById(g.id) || {}).accent);
      leg.appendChild(it);
    });
    sec.appendChild(leg);
    return sec;
  }

  function valueTable(r) {
    var t = r.totals;
    var multBad = Number(t.platform_multiplier) < 1;
    var sec = el("section");
    sec.appendChild(el("div", { class: "eyebrow", text: "Value realized" }));
    sec.appendChild(el("h2", { text: "How each group's value was computed" }));

    var rows = r.groups.map(function (g) {
      return el("tr", null, [
        el("td", null, [el("b", { text: g.name }), el("div", { class: "tiny mono muted", text: g.agent })]),
        el("td", { class: "n", text: "$" + g.local_pool + "M" }),
        el("td", { class: "n", text: A.money(g.capability, 2) }),
        el("td", { class: "n" }, [el("span", { class: multBad ? "mult-bad" : "mult-good", text: A.money(t.platform_multiplier, 2) })]),
        el("td", { class: "n", text: t.cross_pool_unlocked ? A.money((g.cross_pool_share || 0) * 100, 0) + "%" : "—" }),
        el("td", { class: "n" }, [el("b", { text: "$" + A.money(g.value_realized) + "M" })])
      ]);
    });

    sec.appendChild(el("div", { class: "table-scroll" }, [
      el("table", null, [
        el("thead", null, [el("tr", null, [
          el("th", { text: "Group" }), el("th", { class: "n", text: "Local pool" }),
          el("th", { class: "n", text: "Capability c" }), el("th", { class: "n", text: "Multiplier" }),
          el("th", { class: "n", text: "Cross share" }), el("th", { class: "n", text: "Value realized" })
        ])]),
        el("tbody", null, rows),
        el("tfoot", null, [el("tr", null, [
          el("td", null, [el("b", { text: "Enterprise value" })]),
          el("td", { class: "n", text: "" }), el("td", { class: "n", text: "" }),
          el("td", { class: "n", text: "" }), el("td", { class: "n", text: "" }),
          el("td", { class: "n" }, [el("b", { text: "$" + A.money(t.enterprise_value) + "M" })])
        ])])
      ])
    ]));

    sec.appendChild(el("p", { class: "muted small", style: "margin-top:14px",
      text: multBad
        ? "The multiplier is 0.55 because pledges totalled $" + A.money0(t.pledge_total) +
          "M against the $" + M.infrastructure_required + "M the shared platform required. The $" +
          M.cross_pool + "M cross-boundary pool stayed closed."
        : "The platform was funded with $" + A.money0(t.pledge_total) + "M in pledges, so the multiplier is 1.00 and the $" +
          M.cross_pool + "M cross-boundary pool was distributed by contribution." }));
    return sec;
  }

  function rationales(r) {
    var sec = el("section");
    sec.appendChild(el("div", { class: "eyebrow", text: "ATLAS" }));
    sec.appendChild(el("h2", { text: "Why it came out this way" }));
    var wrap = el("div", { class: "rationale" });
    r.groups.forEach(function (g) {
      var c = el("div", { class: "rationale-card" }, [
        el("div", { class: "cd", text: g.agent }),
        el("h3", { text: g.name }),
        el("p", { text: g.rationale })
      ]);
      A.applyAccent(c, (A.groupById(g.id) || {}).accent);
      wrap.appendChild(c);
    });
    sec.appendChild(wrap);
    if (r.narrative) {
      sec.appendChild(el("div", { class: "callout accent a-slate", style: "margin-top:var(--gap)" }, [
        el("div", { class: "eyebrow", text: "The round in one paragraph" }),
        el("p", { class: "mb0", text: r.narrative })
      ]));
    }
    return sec;
  }

  function rubricReveal(r) {
    var sec = el("section");
    sec.appendChild(el("div", { class: "eyebrow", text: "The rubric" }));
    sec.appendChild(el("h2", { text: "All five dimensions" }));
    sec.appendChild(el("div", { class: "callout alarm", style: "margin-bottom:var(--gap)" }, [
      el("p", { class: "mb0" }, [
        el("b", { text: "Dimension 5 was not published before the round." }),
        document.createTextNode(" Enterprise citizenship carried 20% of the weight and no section was told it existed.")
      ])
    ]));

    var wrap = el("div", { class: "rub-grid" });
    r.groups.forEach(function (g) {
      var block = el("div", { class: "rub-group" });
      A.applyAccent(block, (A.groupById(g.id) || {}).accent);
      block.appendChild(el("div", { class: "hd" }, [
        el("b", { text: g.name }), el("span", { class: "cd", text: g.agent })
      ]));
      var scores = el("div", { class: "rub-scores" });
      var weighted = 0;
      S.rubric.forEach(function (d) {
        var v = g.rubric[d.id] || 0;
        weighted += d.weight * v;
        scores.appendChild(el("div", { class: "rub-line" }, [
          el("div", { class: "nm" + (d.public ? "" : " hidden-dim"),
                      text: d.n + " · " + d.name + (d.public ? "" : " (hidden)") }),
          el("div", { class: "tr" }, [el("div", { class: "fl", style: "width:" + (v / 5 * 100) + "%" })]),
          el("div", { class: "vl", text: v + "/5" })
        ]));
      });
      scores.appendChild(el("div", { class: "rub-line", style: "margin-top:6px" }, [
        el("div", { class: "nm" }, [el("b", { text: "Weighted total" })]),
        el("div"),
        el("div", { class: "vl" }, [el("b", { text: A.money(weighted, 2) })])
      ]));
      block.appendChild(scores);
      wrap.appendChild(block);
    });
    sec.appendChild(wrap);
    return sec;
  }

  function counterfactual(r) {
    var cf = A.counterfactual(r);
    if (cf === null) return null;
    var actual = r.totals.enterprise_value;
    if (cf <= actual + 0.5) return null;      // nothing interesting to say

    var sec = el("section");
    sec.appendChild(el("div", { class: "counterfactual" }, [
      el("div", { class: "eyebrow", text: "Counterfactual" }),
      el("p", { class: "big" }, [
        document.createTextNode("If the shared platform had been funded, enterprise value would have been approximately "),
        el("em", { text: "$" + A.money0(cf) + "M" }),
        document.createTextNode(" instead of "),
        el("em", { text: "$" + A.money0(actual) + "M" }),
        document.createTextNode(".")
      ]),
      el("p", { class: "muted small mb0",
        text: "Holding this exact allocation of capital, engineering, and target, and funding the $" +
              M.infrastructure_required + "M platform out of that same capital in proportion to each group's share. " +
              "The $" + M.cross_pool + "M cross-boundary pool is split evenly, since a round that misses the gate records no contribution shares." })
    ]));
    return sec;
  }

  /* ---------- render ---------- */

  function render(r) {
    var out = A.qs("#out");
    out.innerHTML = "";
    out.classList.remove("hide");
    A.qs("#errors").className = "hide";

    out.appendChild(el("section", null, [
      el("div", { class: "eyebrow", text: "Round " + r.round + (r.generated ? " · " + String(r.generated).slice(0, 10) : "") })
    ]));
    out.appendChild(gateBanner(r));
    out.appendChild(commitmentGap(r));
    out.appendChild(leaderboard(r));
    out.appendChild(allocChart(r));
    out.appendChild(valueTable(r));
    out.appendChild(rationales(r));
    out.appendChild(rubricReveal(r));
    var cf = counterfactual(r);
    if (cf) out.appendChild(cf);

    // Make this round available to the brief builder's "what happened last round".
    A.store("aster.results." + r.round, r);

    A.qs("#paste-section").classList.add("hide");
    out.appendChild(el("section", null, [
      el("button", { class: "btn", id: "btn-again", text: "Load a different run",
        onclick: function () {
          out.classList.add("hide");
          A.qs("#paste-section").classList.remove("hide");
          window.scrollTo(0, 0);
        } })
    ]));
    window.scrollTo(0, 0);
  }

  function tryRender(text) {
    var r;
    try { r = JSON.parse(text); }
    catch (e) { showErrors(["Not valid JSON — " + e.message]); return; }
    var errs = A.validateResults(r);
    if (errs.length) { showErrors(errs); return; }
    render(r);
  }

  /* ---------- boot ---------- */

  document.addEventListener("DOMContentLoaded", function () {
    A.qs("#btn-render").addEventListener("click", function () {
      var v = A.qs("#paste").value.trim();
      if (!v) { showErrors(["Nothing pasted yet."]); return; }
      tryRender(v);
    });

    A.qs("#btn-demo").addEventListener("click", function () {
      loadRun("facilitator/demo-run/results.json");
    });

    function loadRun(path) {
      fetch(path)
        .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
        .then(tryRender)
        .catch(function (e) {
          showErrors([
            "Could not load " + path + " — " + e.message,
            "If you opened this page as a file:// URL, the browser blocks reading local files.",
            "Open " + path + " in a text editor and paste its contents into the box above."
          ]);
        });
    }

    var run = A.param("run");
    if (run && /^[\w./-]+\.json$/.test(run) && run.indexOf("..") === -1) loadRun(run);
  });
})();
</script>
</body>
</html>
