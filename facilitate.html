<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — Facilitator guide</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="doc">

  <nav id="nav"></nav>

  <header class="doc__head">
    <h1 id="title"></h1>
    <p class="standfirst" id="standfirst"></p>
    <p class="warning" id="warning"></p>
  </header>

  <section class="intro">
    <h2 id="intro-heading"></h2>
    <p class="caption" id="intro-lead"></p>
    <blockquote class="script" id="intro-body"></blockquote>
  </section>

  <section>
    <h2 id="run-heading"></h2>
    <p class="caption" id="run-caption"></p>
    <ol class="run" id="run"></ol>
  </section>

  <section>
    <h2 id="flow-heading"></h2>
    <p class="caption" id="flow-caption"></p>
    <div class="flow" id="flow"></div>
  </section>

  <section>
    <h2 id="key-heading"></h2>
    <p class="caption" id="key-caption"></p>
    <table class="grid" id="key"></table>
  </section>

  <section>
    <h2 id="moments-heading"></h2>
    <div class="moments" id="moments"></div>
  </section>

  <section>
    <h2 id="trouble-heading"></h2>
    <table class="grid" id="trouble"></table>
  </section>

  <section>
    <h2 id="pushback-heading"></h2>
    <div class="qa" id="pushback"></div>
  </section>

  <section class="handoff">
    <h2 id="handoff-heading"></h2>
    <p class="prose" id="handoff-body"></p>
  </section>

  <section>
    <h2 id="keys-heading"></h2>
    <p class="caption" id="keys-caption"></p>
    <p class="prose" id="keys-note"></p>
  </section>

  <section class="closing">
    <h2 id="close-heading"></h2>
    <p id="close-body"></p>
  </section>

  <footer class="doc__foot">
    <a class="btn btn--primary" href="sim.html" id="to-sim"></a>
    <a class="link-quiet" href="index.html" id="to-index"></a>
  </footer>

</div>

<script src="data/model.js"></script>
<script src="data/script.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
  var G = S.facilitate;
  var fill = FMT.fill;
  var el = function (id) { return document.getElementById(id); };

  function table(node, headers, rows, cls) {
    node.innerHTML = "<thead><tr>" + headers.map(function () { return "<th></th>"; }).join("") +
                     "</tr></thead><tbody></tbody>";
    var ths = node.querySelectorAll("th");
    headers.forEach(function (h, i) {
      ths[i].textContent = h;
      if (cls && cls[i]) ths[i].className = cls[i];
    });
    var tb = node.querySelector("tbody");
    rows.forEach(function (cells) {
      var tr = document.createElement("tr");
      cells.forEach(function (c, i) {
        var td = document.createElement("td");
        if (cls && cls[i]) td.className = cls[i];
        td.textContent = fill(c);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }

  document.title = A.meta.org + " — " + G.title;
  el("title").textContent = G.title;
  el("standfirst").textContent = fill(G.standfirst);
  el("warning").textContent = G.warning;

  /* The intro to read to the class */
  el("intro-heading").textContent = G.intro.heading;
  el("intro-lead").textContent = fill(G.intro.lead);
  G.intro.body.forEach(function (text) {
    var p = document.createElement("p");
    p.textContent = fill(text);
    el("intro-body").appendChild(p);
  });

  /* How to run it — numbered steps */
  el("run-heading").textContent = G.run.heading;
  el("run-caption").textContent = fill(G.run.caption);
  G.run.steps.forEach(function (text) {
    var li = document.createElement("li");
    li.textContent = fill(text);
    el("run").appendChild(li);
  });

  /* What each group works through */
  el("flow-heading").textContent = G.flow.heading;
  el("flow-caption").textContent = fill(G.flow.caption);
  G.flow.items.forEach(function (item) {
    var card = document.createElement("div");
    card.className = "flow__item";
    var head = document.createElement(item.href ? "a" : "span");
    head.className = "flow__label";
    if (item.href) head.href = item.href;
    head.textContent = item.label;
    var body = document.createElement("p");
    body.textContent = fill(item.body);
    card.appendChild(head);
    card.appendChild(body);
    el("flow").appendChild(card);
  });

  /* The answer key — read out of the model, never typed */
  el("key-heading").textContent = G.key.heading;
  el("key-caption").textContent = fill(G.key.caption);
  table(el("key"),
    ["Division", "Block", "The move(s) that answer it", G.key.tell_heading],
    A.groups.map(function (g) {
      var needs = FMT.needs(g.id);
      return [
        g.short,
        g.block.charAt(0).toUpperCase() + g.block.slice(1),
        needs.map(function (id) { return FMT.move(id).label; }).join(" + "),
        G.key.tells[g.id]
      ];
    }),
    ["factor", "", "factor", "tell"]);

  /* What to draw out in the debrief */
  el("moments-heading").textContent = G.moments.heading;
  G.moments.items.forEach(function (m) {
    var d = document.createElement("div");
    d.className = "moment";
    var h = document.createElement("h3");
    h.textContent = m.title;
    var p = document.createElement("p");
    p.textContent = fill(m.body);
    d.appendChild(h);
    d.appendChild(p);
    el("moments").appendChild(d);
  });

  /* If a group gets stuck */
  el("trouble-heading").textContent = G.trouble.heading;
  table(el("trouble"), ["If", "Then"], G.trouble.rows, ["factor", ""]);

  /* Questions to reconvene on */
  el("pushback-heading").textContent = G.pushback.heading;
  G.pushback.items.forEach(function (item) {
    var d = document.createElement("div");
    d.className = "qa__item";
    var q = document.createElement("h3");
    q.textContent = item.q;
    var a = document.createElement("p");
    a.textContent = fill(item.a);
    d.appendChild(q);
    d.appendChild(a);
    el("pushback").appendChild(d);
  });

  /* Where this sits in the session */
  el("handoff-heading").textContent = G.handoff.heading;
  el("handoff-body").textContent = fill(G.handoff.body);

  /* Driving the board */
  el("keys-heading").textContent = G.keys.heading;
  el("keys-caption").textContent = fill(G.keys.caption);
  el("keys-note").textContent = fill(G.keys.note);

  /* Before class */
  el("close-heading").textContent = G.close.heading;
  el("close-body").textContent = fill(G.close.body);

  el("to-sim").textContent = "OPEN THE EXERCISE";
  el("to-index").textContent = "The situation";
})();
</script>
</body>
</html>
