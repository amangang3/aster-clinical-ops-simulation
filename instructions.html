<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — How the session works</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="doc-body">
<div class="doc">

  <nav id="nav"></nav>

  <header class="doc__head">
    <h1 id="title"></h1>
    <p class="standfirst" id="standfirst"></p>
  </header>

  <section class="youare">
    <h2 id="you-heading"></h2>
    <div class="prose" id="you"></div>
  </section>

  <section>
    <h2 id="situation-heading"></h2>
    <div class="prose" id="situation"></div>
    <p class="prose callout" id="situation-note"></p>
  </section>

  <section>
    <h2 id="blocks-heading"></h2>
    <p class="caption" id="blocks-caption"></p>
    <table class="grid" id="blocks"></table>
    <p class="prose callout" id="blocks-note"></p>
  </section>

  <section>
    <h2 id="job-heading"></h2>
    <div class="prose" id="job"></div>
  </section>

  <section>
    <h2 id="moves-heading"></h2>
    <p class="caption" id="moves-caption"></p>
    <table class="grid grid--deals" id="moves"></table>
    <p class="prose" id="moves-note"></p>
  </section>

  <section class="pair">
    <div>
      <h2 id="rules-heading"></h2>
      <ul class="rules" id="rules"></ul>
    </div>
    <div>
      <h2 id="watch-heading"></h2>
      <div class="prose" id="watch"></div>
    </div>
  </section>

  <footer class="doc__foot">
    <a class="btn btn--primary" href="sim.html" id="next"></a>
    <a class="link-quiet" href="index.html#divisions" id="skip"></a>
  </footer>

</div>

<script src="data/model.js"></script>
<script src="data/script.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
  var I = S.instructions;
  var fill = FMT.fill;
  var el = function (id) { return document.getElementById(id); };

  function paras(hostId, list) {
    list.forEach(function (text) {
      var p = document.createElement("p");
      p.textContent = fill(text);
      el(hostId).appendChild(p);
    });
  }

  function tbody(host) {
    host.innerHTML = "<tbody></tbody>";
    return host.querySelector("tbody");
  }

  function tr(body, cells) {
    var row = document.createElement("tr");
    cells.forEach(function (c) {
      var td = document.createElement("td");
      if (c.cls) td.className = c.cls;
      if (c.node) td.appendChild(c.node); else td.textContent = fill(c.text);
      row.appendChild(td);
    });
    body.appendChild(row);
    return row;
  }

  document.title = A.meta.org + " — " + I.title;
  el("title").textContent = I.title;
  el("standfirst").textContent = fill(I.standfirst);

  /* Who the room is playing. First, because nothing else makes sense without it. */
  el("you-heading").textContent = I.you.heading;
  paras("you", I.you.body);

  /* What is being decided */
  el("situation-heading").textContent = I.situation.heading;
  paras("situation", I.situation.body);
  el("situation-note").textContent = fill(I.situation.note);

  /* What each division is worried about — the challenges, before any of the arithmetic.
     One line per division, in its own accent, taken from the division copy. */
  el("blocks-heading").textContent = I.blocks.heading;
  el("blocks-caption").textContent = fill(I.blocks.caption);
  var blocks = tbody(el("blocks"));
  A.groups.forEach(function (g) {
    var name = document.createElement("span");
    name.className = "swatch accent-" + g.accent;
    name.innerHTML = '<span class="dot"></span>';
    name.appendChild(document.createTextNode(g.short));
    tr(blocks, [
      { cls: "factor", node: name },
      { text: S.groups[g.id].worry }
    ]);
  });
  el("blocks-note").textContent = fill(I.blocks.note);

  el("job-heading").textContent = I.job.heading;
  paras("job", I.job.body);

  /* The four deals: framework label, what it is in plain words. No cost — this is number-free. */
  el("moves-heading").textContent = I.moves.heading;
  el("moves-caption").textContent = fill(I.moves.caption);
  var moves = tbody(el("moves"));
  el("moves").insertAdjacentHTML("afterbegin",
    "<thead><tr><th>The deal</th><th>What you are offering them</th></tr></thead>");
  A.moves.forEach(function (m) {
    var d = S.deals[m.id];
    var head = document.createElement("span");
    head.className = "deal";
    head.innerHTML = '<b></b><span></span>';
    head.querySelector("b").textContent = m.label;
    head.querySelector("span").textContent = d.name;
    tr(moves, [
      { cls: "factor", node: head },
      { text: d.what }
    ]);
  });
  el("moves-note").textContent = fill(I.moves.note);

  el("rules-heading").textContent = I.rules.heading;
  I.rules.items.forEach(function (item) {
    var li = document.createElement("li");
    li.textContent = fill(item);
    el("rules").appendChild(li);
  });

  el("watch-heading").textContent = I.watch.heading;
  paras("watch", I.watch.body);

  el("next").textContent = I.ready;
  el("skip").textContent = S.divisions.back;
})();
</script>
</body>
</html>
