<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster Life Sciences — How the session works</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="doc-body">
<div class="doc">

  <nav id="nav"></nav>

  <header class="doc__head">
    <h1 id="title"></h1>
    <p class="standfirst" id="standfirst"></p>
  </header>

  <section class="youare">
    <h2 id="you-heading"></h2>
    <div class="prose" id="you"></div>
  </section>

  <section>
    <h2 id="situation-heading"></h2>
    <div class="prose" id="situation"></div>
    <p class="caption" id="situation-table-caption"></p>
    <table class="grid" id="pledges"></table>
    <p class="prose callout" id="situation-note"></p>
  </section>

  <section>
    <h2 id="numbers-heading"></h2>
    <p class="caption" id="numbers-caption"></p>
    <table class="grid" id="numbers"></table>
    <dl class="worked" id="worked"></dl>
    <p class="prose callout" id="numbers-note"></p>
  </section>

  <section>
    <h2 id="job-heading"></h2>
    <div class="prose" id="job"></div>
  </section>

  <section>
    <h2 id="moves-heading"></h2>
    <p class="caption" id="moves-caption"></p>
    <table class="grid grid--deals" id="moves"></table>
    <p class="prose" id="moves-note"></p>

    <h3 id="money-heading"></h3>
    <table class="grid" id="money"></table>
  </section>

  <section>
    <h2 id="applying-heading"></h2>
    <p class="caption" id="applying-lead"></p>
    <table class="grid" id="applying"></table>
  </section>

  <section class="pair">
    <div>
      <h2 id="rules-heading"></h2>
      <ul class="rules" id="rules"></ul>
    </div>
    <div>
      <h2 id="watch-heading"></h2>
      <div class="prose" id="watch"></div>
    </div>
  </section>

  <footer class="doc__foot">
    <a class="btn btn--primary" href="divisions.html" id="next"></a>
    <a class="link-quiet" href="sim.html" id="skip"></a>
  </footer>

</div>

<script src="data/model.js"></script>
<script src="data/script.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, S = window.ASTER_SCRIPT, FMT = window.ASTER_FMT;
  var I = S.instructions;
  var fill = FMT.fill, money = FMT.moneyInt;
  var el = function (id) { return document.getElementById(id); };

  function paras(hostId, list) {
    list.forEach(function (text) {
      var p = document.createElement("p");
      p.textContent = fill(text);
      el(hostId).appendChild(p);
    });
  }

  function tbody(host) {
    host.innerHTML = "<tbody></tbody>";
    return host.querySelector("tbody");
  }

  function tr(body, cells) {
    var row = document.createElement("tr");
    cells.forEach(function (c) {
      var td = document.createElement("td");
      if (c.cls) td.className = c.cls;
      if (c.node) td.appendChild(c.node); else td.textContent = fill(c.text);
      row.appendChild(td);
    });
    body.appendChild(row);
    return row;
  }

  document.title = A.meta.org + " — " + I.title;
  el("title").textContent = I.title;
  el("standfirst").textContent = fill(I.standfirst);

  /* Who the room is playing. First, because nothing else makes sense without it. */
  el("you-heading").textContent = I.you.heading;
  paras("you", I.you.body);

  /* What is being decided, and what each division is asked for */
  el("situation-heading").textContent = I.situation.heading;
  paras("situation", I.situation.body);
  el("situation-table-caption").textContent = fill(I.situation.table_caption);
  var pledges = tbody(el("pledges"));
  A.groups.forEach(function (g) {
    var name = document.createElement("span");
    name.className = "swatch accent-" + g.accent;
    name.innerHTML = '<span class="dot"></span>';
    name.appendChild(document.createTextNode(g.short));
    tr(pledges, [
      { cls: "factor", node: name },
      { cls: "num", text: money(g.capital_need) },
      { cls: "num", text: money(g.pledge) }
    ]);
  });
  // The total row is the point of the table: the three shares are exactly the build cost.
  var total = tr(pledges, [
    { cls: "factor", text: "All three together" },
    { cls: "num", text: money(FMT.sum("capital_need")) },
    { cls: "num", text: money(FMT.sum("pledge")) }
  ]);
  total.className = "is-total";
  el("pledges").insertAdjacentHTML("afterbegin",
    "<thead><tr><th>Division</th><th class='num'>Its own technology budget</th>" +
    "<th class='num'>Share of the " + money(A.infrastructure_required) + " layer</th></tr></thead>");
  el("situation-note").textContent = fill(I.situation.note);

  /* Where the numbers come from */
  el("numbers-heading").textContent = I.numbers.heading;
  el("numbers-caption").textContent = fill(I.numbers.caption);
  var numbers = tbody(el("numbers"));
  I.numbers.rows.forEach(function (row) {
    tr(numbers, [{ cls: "factor", text: row[0] }, { text: row[1] }]);
  });

  /* The fourth rule, worked through on one division so the arithmetic is visible. */
  var g = A.groups[0];
  var left = g.capital_need - g.pledge;
  var pct = Math.round(left / g.capital_need * 100) + "%";
  [
    ["Its own technology budget", money(g.capital_need)],
    ["Its share of the layer", "− " + money(g.pledge)],
    ["Left for its own plans", money(left) + ", which is " + pct + " of what it needed"],
    ["So its value pool of " + money(g.local_pool) + " delivers", pct + " of what it could"]
  ].forEach(function (pair) {
    var dt = document.createElement("dt");
    dt.textContent = pair[0];
    var dd = document.createElement("dd");
    dd.textContent = pair[1];
    el("worked").appendChild(dt);
    el("worked").appendChild(dd);
  });
  el("numbers-note").textContent = fill(I.numbers.note);

  el("job-heading").textContent = I.job.heading;
  paras("job", I.job.body);

  /* The three deals: framework label, what it is in plain words, and the price. */
  el("moves-heading").textContent = I.moves.heading;
  el("moves-caption").textContent = fill(I.moves.caption);
  var moves = tbody(el("moves"));
  el("moves").insertAdjacentHTML("afterbegin",
    "<thead><tr><th>The deal</th><th class='num'>What it costs you</th>" +
    "<th>What you are offering them</th></tr></thead>");
  A.moves.forEach(function (m) {
    var d = S.deals[m.id];
    var head = document.createElement("span");
    head.className = "deal";
    head.innerHTML = '<b></b><span></span>';
    head.querySelector("b").textContent = m.label;
    head.querySelector("span").textContent = d.name;
    tr(moves, [
      { cls: "factor", node: head },
      { cls: "num", text: money(m.cost) },
      { text: d.what }
    ]);
  });
  el("moves-note").textContent = fill(I.moves.note);

  /* The two pots of money. Confusing these two is the single easiest mistake to make. */
  el("money-heading").textContent = I.moves.money_heading;
  var money = tbody(el("money"));
  I.moves.money.forEach(function (row) {
    tr(money, [{ cls: "factor", text: row[0] }, { text: row[1] }]);
  });

  /* What offering a deal actually does. */
  el("applying-heading").textContent = I.applying.heading;
  el("applying-lead").textContent = fill(I.applying.lead);
  var applying = tbody(el("applying"));
  I.applying.rows.forEach(function (row) {
    tr(applying, [{ cls: "factor", text: row[0] }, { text: row[1] }]);
  });

  el("rules-heading").textContent = I.rules.heading;
  I.rules.items.forEach(function (item) {
    var li = document.createElement("li");
    li.textContent = fill(item);
    el("rules").appendChild(li);
  });

  el("watch-heading").textContent = I.watch.heading;
  paras("watch", I.watch.body);

  el("next").textContent = I.ready;
  el("skip").textContent = S.nav.steps[3].label;
})();
</script>
</body>
</html>
