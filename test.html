<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model check</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="debrief">
  <h1>Model check</h1>
  <p class="caption">Not linked from anywhere. Enumerates every reachable state and checks it
     against the outcome table in the build spec, to two decimal places.</p>
  <h2 id="verdict"></h2>
  <table class="grid" id="t"></table>
  <h2>All-committed, per division</h2>
  <table class="grid" id="p"></table>
  <h2>Deal economics</h2>
  <table class="grid" id="e"></table>
</div>

<script src="data/model.js"></script>
<script>
(function () {
  "use strict";
  var A = window.ASTER, FMT = window.ASTER_FMT;
  var money = FMT.money, moneyInt = FMT.moneyInt;

  // The expected table, transcribed from the build spec. Keyed by sorted member ids.
  var EXPECTED = {
    "": 167.75,
    "data-analytics": 153.50,
    "patient-engagement": 154.92,
    "site-ops": 144.06,
    "data-analytics|patient-engagement": 140.67,
    "patient-engagement|site-ops": 131.22,
    "data-analytics|site-ops": 129.81,
    "data-analytics|patient-engagement|site-ops": 278.25
  };
  var EXPECTED_PER = {
    "site-ops":           [0.692, 96.92, 27.69, 124.62],
    "data-analytics":     [0.727, 69.09, 14.55, 83.64],
    "patient-engagement": [0.667, 46.67, 23.33, 70.00]
  };

  var fails = 0;
  function check(actual, expected, dp) {
    var ok = Math.abs(actual - expected) < (dp === 3 ? 0.0005 : 0.005);
    if (!ok) fails++;
    return ok;
  }

  var rows = "";
  FMT.outcomes().forEach(function (o) {
    var r = o.result;
    var exp = EXPECTED[o.key];
    var ok = check(r.enterprise, exp);
    var names = o.members.length
      ? o.members.map(function (id) { return FMT.group(id).short; }).join(" + ")
      : "Nobody";
    rows += "<tr><td>" + names + "</td>" +
      "<td class='num'>" + moneyInt(r.pledged) + "</td>" +
      "<td class='" + (r.funded ? "mint" : "coral") + "'>" + (r.funded ? "Funded" : "Not funded") + "</td>" +
      "<td class='num'>" + money(r.enterprise) + "</td>" +
      "<td class='num'>" + money(exp) + "</td>" +
      "<td class='" + (ok ? "mint" : "coral") + "'>" + (ok ? "match" : "MISMATCH") + "</td>" +
      "<td class='" + (r.funded || r.enterprise < EXPECTED[""] ? "mint" : "coral") + "'>" +
        (r.funded ? "n/a" : (r.enterprise < EXPECTED[""] ? "below doing nothing" : "NOT BELOW")) + "</td></tr>";
  });
  document.getElementById("t").innerHTML =
    "<thead><tr><th>Committed</th><th class='num'>Pledged</th><th>Layer</th>" +
    "<th class='num'>Computed</th><th class='num'>Spec</th><th>Check</th>" +
    "<th>Partial-coalition invariant</th></tr></thead><tbody>" + rows + "</tbody>";

  var all = {};
  A.groups.forEach(function (g) { all[g.id] = true; });
  var full = window.compute({ committed: all, applied: [], spent: 0 });
  var prows = "";
  full.per.forEach(function (p) {
    var e = EXPECTED_PER[p.id];
    var ok = check(p.capability, e[0], 3) & check(p.local, e[1]) & check(p.cross, e[2]) & check(p.value, e[3]);
    prows += "<tr><td>" + FMT.group(p.id).short + "</td>" +
      "<td class='num'>" + p.capability.toFixed(3) + "</td>" +
      "<td class='num'>" + money(p.local) + "</td>" +
      "<td class='num'>" + money(p.cross) + "</td>" +
      "<td class='num'>" + money(p.value) + "</td>" +
      "<td class='" + (ok ? "mint" : "coral") + "'>" + (ok ? "match" : "MISMATCH") + "</td></tr>";
  });
  document.getElementById("p").innerHTML =
    "<thead><tr><th>Division</th><th class='num'>Capability</th><th class='num'>Local</th>" +
    "<th class='num'>Cross</th><th class='num'>Total</th><th>Check</th></tr></thead><tbody>" + prows + "</tbody>";

  var base = window.compute({ committed: {}, applied: [], spent: 0 }).enterprise;
  var cost = A.moves.reduce(function (s, m) { return s + m.cost; }, 0);
  var gain = full.enterprise - base;
  check(cost, 27); check(gain, 110.50); check(gain / cost, 4.09);
  check(FMT.sum("pledge"), A.infrastructure_required);
  check(FMT.sum("capital_need"), 60);
  document.getElementById("e").innerHTML =
    "<tbody>" +
    "<tr><td>Cost of the four correct moves</td><td class='num'>" + moneyInt(cost) + "</td><td class='num'>$27M</td></tr>" +
    "<tr><td>Gain over doing nothing</td><td class='num'>" + money(gain) + "</td><td class='num'>$110.50M</td></tr>" +
    "<tr><td>Return</td><td class='num'>" + (gain / cost).toFixed(2) + "&times;</td><td class='num'>4.09&times;</td></tr>" +
    "<tr><td>Pledges sum to the build cost</td><td class='num'>" + moneyInt(FMT.sum("pledge")) + "</td><td class='num'>" + moneyInt(A.infrastructure_required) + "</td></tr>" +
    "<tr><td>Capital needs sum to the platform pool</td><td class='num'>" + moneyInt(FMT.sum("capital_need")) + "</td><td class='num'>$60M</td></tr>" +
    "</tbody>";

  var v = document.getElementById("verdict");
  v.textContent = fails === 0 ? "PASS — every state matches the spec" : fails + " CHECK(S) FAILED";
  v.className = fails === 0 ? "mint" : "coral";
})();
</script>
</body>
</html>
